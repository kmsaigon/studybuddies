{% extends 'base.html' %}
{% block content %}
    <header class = "masthead bg-index text-white text-center py-4">
        <div class="container d-flex align-items-center flex-column pt-2">
            <h2>StudyBuddies</h2>
            <p>Connect with peers in your courses and form study groups.</p>
        </div>
    </header>
    <div class="p-3">
        <div class="container">
            <div class="row mt-3">
                <div class="col mx-auto text-center mb-3">
                    <h4>Welcome to your study group networking platform.</h4>
                    {% if not user.is_authenticated %}
                    <div class="mt-4">
                        <a href="{% url 'accounts:signup' %}" class="btn btn-primary btn-lg me-2">Get Started</a>
                        <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary btn-lg">Log In</a>
                    </div>
                    {% else %}
                    <div class="mt-4">
                        <a href="{% url 'buddies:listing_search' %}" class="btn btn-primary btn-lg me-2">Find a Study Group</a>
                        <a href="{% url 'home:dashboard' %}" class="btn btn-outline-primary btn-lg">Dashboard</a>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
